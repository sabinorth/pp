<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
  <title>Прага + Париж 2026</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main id="view" class="view"></main>
  <section id="map-view" class="map-view" hidden></section>

  <div id="sheet" class="sheet" role="dialog" aria-label="Подробности" aria-hidden="true">
    <div class="sheet-bar">
      <span class="sheet-handle" aria-hidden="true"></span>
      <button type="button" class="sheet-close" aria-label="Закрыть">✕</button>
    </div>
    <div class="sheet-body"></div>
  </div>

  <nav class="tabbar" aria-label="Разделы">
    <a href="#/plan" data-tab="plan"><span class="tab-icon" aria-hidden="true">📅</span><span>План</span></a>
    <a href="#/map" data-tab="map"><span class="tab-icon" aria-hidden="true">🗺️</span><span>Карта</span></a>
    <a href="#/recs" data-tab="recs"><span class="tab-icon" aria-hidden="true">💡</span><span>Советы</span></a>
    <a href="#/games" data-tab="games"><span class="tab-icon" aria-hidden="true">🎲</span><span>Игры</span></a>
  </nav>
</body>
</html>
